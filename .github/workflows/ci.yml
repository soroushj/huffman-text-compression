name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet build

      - run: dotnet test

      # Git on Windows checks out files with CRLF line endings, which the format check would report
      - if: runner.os == 'Linux'
        run: dotnet format --verify-no-changes
